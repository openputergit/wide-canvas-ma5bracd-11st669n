<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dubai Luxury Perfumes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
        .title {
            font-family: 'Playfair Display', serif;
        }
        .perfume-card:hover {
            transform: translateY(-5px);
            transition: transform 0.3s ease;
        }
    </style>
</head>
<body class="bg-[#edf2f7]">
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <h1 class="title text-2xl font-bold text-gray-800">Dubai Luxe Perfumes</h1>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="mb-8">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                <input type="text" id="search" placeholder="Search perfumes..." class="p-2 rounded-lg border border-gray-300 w-full md:w-64">
                <select id="brand-filter" class="p-2 rounded-lg border border-gray-300 w-full md:w-48">
                    <option value="">All Brands</option>
                    <option value="Ajmal">Ajmal</option>
                    <option value="Swiss Arabian">Swiss Arabian</option>
                    <option value="Rasasi">Rasasi</option>
                </select>
                <select id="duration-filter" class="p-2 rounded-lg border border-gray-300 w-full md:w-48">
                    <option value="">All Durations</option>
                    <option value="12+">12+ Hours</option>
                    <option value="24+">24+ Hours</option>
                </select>
            </div>
        </div>

        <div id="perfume-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Perfumes will be populated here -->
        </div>
    </main>

    <script>
        const perfumes = [
            {
                name: "Majesty Oud",
                brand: "Ajmal",
                duration: "24+",
                price: "AED 750",
                description: "A royal blend of oud, rose and amber",
                image: "https://images.unsplash.com/photo-1619994403073-2cec844b8e63?w=800&auto=format&fit=crop&q=60&ixlib=rb-4.0.3"
            },
            {
                name: "Shaghaf Oud",
                brand: "Swiss Arabian",
                duration: "12+",
                price: "AED 550",
                description: "Luxurious oriental fragrance",
                image: "https://images.unsplash.com/photo-1594035795390-15fbee84d657?w=800&auto=format&fit=crop&q=60&ixlib=rb-4.0.3"
            },
            {
                name: "La Yuqawam",
                brand: "Rasasi",
                duration: "24+",
                price: "AED 650",
                description: "Premium leather and oud blend",
                image: "https://images.unsplash.com/photo-1595425964272-ee0196b5b066?w=800&auto=format&fit=crop&q=60&ixlib=rb-4.0.3"
            },
            // Add more perfumes as needed
        ];

        function renderPerfumes(filteredPerfumes) {
            const grid = document.getElementById('perfume-grid');
            grid.innerHTML = '';

            filteredPerfumes.forEach(perfume => {
                const card = `
                    <div class="perfume-card bg-white rounded-lg shadow-md overflow-hidden">
                        <img src="${perfume.image}" alt="${perfume.name}" class="w-full h-48 object-cover">
                        <div class="p-4">
                            <h3 class="title text-xl font-bold mb-2">${perfume.name}</h3>
                            <p class="text-gray-600 mb-2">${perfume.brand}</p>
                            <p class="text-gray-800 font-semibold mb-2">${perfume.price}</p>
                            <p class="text-gray-600 mb-2">${perfume.description}</p>
                            <p class="text-sm text-gray-500">Duration: ${perfume.duration} hours</p>
                        </div>
                    </div>
                `;
                grid.innerHTML += card;
            });
        }

        function filterPerfumes() {
            const searchTerm = document.getElementById('search').value.toLowerCase();
            const brandFilter = document.getElementById('brand-filter').value;
            const durationFilter = document.getElementById('duration-filter').value;

            let filtered = perfumes.filter(perfume => {
                const matchesSearch = perfume.name.toLowerCase().includes(searchTerm) ||
                                    perfume.description.toLowerCase().includes(searchTerm);
                const matchesBrand = !brandFilter || perfume.brand === brandFilter;
                const matchesDuration = !durationFilter || perfume.duration === durationFilter;

                return matchesSearch && matchesBrand && matchesDuration;
            });

            renderPerfumes(filtered);
        }

        // Add event listeners
        document.getElementById('search').addEventListener('input', filterPerfumes);
        document.getElementById('brand-filter').addEventListener('change', filterPerfumes);
        document.getElementById('duration-filter').addEventListener('change', filterPerfumes);

        // Initial render
        renderPerfumes(perfumes);
    </script>
<script>document.body.addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); return }, { passive: false })</script>
	</body>
</html>
